name: TelME2
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8           # match your driver; switch to 12.x if needed
  - pytorch>=2.0,<2.4
  - torchaudio>=2.0,<2.4
  - torchvision>=0.15,<0.19
  - pytorch-cuda=11.8          # comment this line if installing CPU-only
  - ffmpeg                     # required by librosa / torchaudio decoders
  - pip:
      - transformers>=4.36,<4.45
      - tokenizers>=0.15
      - sentencepiece>=0.1.99
      - safetensors>=0.4
      - huggingface-hub>=0.20
      - accelerate>=0.25
      - librosa>=0.10
      - soundfile>=0.12
      - opencv-python>=4.8
      - pillow>=10.0
      - timm>=0.9
      - scikit-learn>=1.3
      - pandas>=2.0
      - numpy>=1.24,<2.0
      - tqdm>=4.66
      - matplotlib>=3.7
